[project]
name = "test-analysis"
version = "0.1.0"
description = "Lab Scan Reader: vision-LLM reads lab scans into a patient card with human review."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "pydantic-settings",
    "sqlalchemy>=2",
    "openai",
    "pypdfium2",
    "pillow",
    "python-multipart",
    "httpx",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/test_analysis"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Workflow tooling is installed as-is and not linted with project rules
extend-exclude = [".claude", "scripts/validate_agent_output.py", "scripts/validate_workflow_state.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
